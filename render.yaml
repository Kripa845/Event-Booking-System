# Render Blueprint: backend API + PostgreSQL. Create it from Render's dashboard
# ("New" -> "Blueprint", pick this repo). See DEPLOY.md for the full steps.
databases:
  - name: eventhub-db
    plan: free

services:
  - type: web
    name: eventhub-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: eventhub-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false          # e.g. eventhub-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # e.g. https://eventhub.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false          # e.g. https://eventhub-api.onrender.com
      - key: FRONTEND_URL
        sync: false          # e.g. https://eventhub.vercel.app (eSewa returns here)
      - key: ANTHROPIC_API_KEY
        sync: false          # optional: plain-English smart search
